name: automerge
# pull_request_target runs this file as it is on main, never the pull request's copy.
# The allowlist is .github/automerge-paths.json on the base commit: one entry per vendor graph
# (scripts/graphs.sh), the paths CODEOWNERS leaves without an owner. The required bump-only check
# accepts only date bumps in them.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    uses: @@org.repo@@/.github/workflows/automerge.yml@@@org.sha@@ # @@org.ref@@
    with:
      trusted-authors: '@@org.trustedAuthors@@'
      merge-method: @@org.mergeMethod@@
