name: automerge
# pull_request_target runs this file as it is on main, never the pull request's copy.
# allow-paths has one entry per vendor graph (scripts/graphs.sh); CODEOWNERS leaves the same paths
# without an owner. The required bump-only check accepts only date bumps in them.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    uses: @@org.repo@@/.github/workflows/automerge.yml@@@org.sha@@
    with:
      allow-paths: '@@gen.allowPaths@@'
      trusted-authors: '@@org.trustedAuthors@@'
      merge-method: @@org.mergeMethod@@
