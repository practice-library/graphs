name: automerge
# pull_request_target runs this file as it is on main, never the pull request's copy.
# The allowlist is empty until this repository decides which paths may merge without review.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    uses: practice-library/.github/.github/workflows/automerge.yml@0e6f5ed237dd52f9fe02a33f8c6b8ec653a3a2c3
    with:
      allow-paths: '[]'
      trusted-authors: '["practice-library[bot]"]'
