# Generated from templates/.github/workflows/automerge.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: automerge
# pull_request_target runs this file as it is on main, never the pull request's copy.
# The allowlist is .github/automerge-paths.json on the base commit: one entry per vendor graph
# (scripts/graphs.sh), the paths CODEOWNERS leaves without an owner. The required bump-only check
# accepts only date bumps in them.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    uses: practice-library/.github/.github/workflows/automerge.yml@75a03317883e16f7ad93f1239dc53c9d0e1c4cc1 # v2.4.0
    with:
      trusted-authors: '["practice-library[bot]"]'
      merge-method: merge
