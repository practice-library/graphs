# Generated from templates/.github/workflows/checks.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: checks
# Every check a pull request must pass; the ruleset requires "gate / gate".
# Reusable workflows come from practice-library/.github, pinned to one commit.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    name: render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generated files match templates/ and policy/constants.json
        run: bash scripts/render.sh --check

  selftest:
    name: selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The scripts the checks use pass and fail where their cases say
        run: bash scripts/selftest.sh

  discover:
    name: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every check.json, contract example and counter-example
        id: list
        run: |
          set -euo pipefail
          targets="$(bash scripts/discover.sh)"
          echo "$targets" | jq .
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  schema-check:
    name: schema-check (${{ matrix.name }})
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    uses: practice-library/.github/.github/workflows/schema-check.yml@cb535908f8b5c4314b6a21232dedd9e5b5048c10
    with:
      schema: ${{ matrix.schema }}
      instances: ${{ matrix.instances }}
      expect: ${{ matrix.expect }}

  leak-scan:
    uses: practice-library/.github/.github/workflows/leak-scan.yml@cb535908f8b5c4314b6a21232dedd9e5b5048c10

  gate:
    if: always()
    needs: [render, selftest, discover, schema-check, leak-scan]
    uses: practice-library/.github/.github/workflows/gate.yml@cb535908f8b5c4314b6a21232dedd9e5b5048c10
    with:
      needs: ${{ toJSON(needs) }}
      required: '["render","selftest","discover","schema-check","leak-scan"]'
