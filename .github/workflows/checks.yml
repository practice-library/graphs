# Generated from templates/.github/workflows/checks.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: checks
# Every check a pull request must pass; the ruleset requires "gate / gate".
# Reusable workflows come from practice-library/.github, pinned to the full commit of release v2.6.0.
# The gate's needs and .github/required-checks.json are both rendered from gate.needs in policy/constants.json.
on:
  pull_request:
    branches: [main]
    # labeled and unlabeled re-run schema-loosening when a maintainer adds or removes its label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    name: render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generated files match templates/ and policy/constants.json
        run: bash scripts/render.sh --check
      - name: Each graph's INDEX.md is what scripts/index.sh generates
        run: bash scripts/index.sh --check
      - name: scripts/index.sh passes and fails where its cases say
        run: bash scripts/index-selftest.sh

  selftest:
    name: selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The scripts the checks use pass and fail where their cases say
        run: bash scripts/selftest.sh

  guards:
    name: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every guard in the scripts, mutated, makes a named self-test case fail
        run: python3 scripts/guards.py

  bump-only:
    name: bump-only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: A pull request touching only allowlisted paths is a date bump and nothing else
        run: bash scripts/bump-only.sh pr

  graph-check:
    name: graph-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Edges stay inside each graph and mean what their relation says; every source host is in policy/sources.json
        run: bash scripts/graph-check.sh
      - name: Host approval is no broader than its evidence (paths, robots url, unique keys, permission state)
        run: python3 scripts/sources-check.py

  discover:
    uses: practice-library/.github/.github/workflows/discover.yml@1927f933ff655934a99660161efc0ca277eea8f0 # v2.6.0
    with:
      check: schema-check

  schema-check:
    name: schema-check (${{ matrix.instances }})
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    uses: practice-library/.github/.github/workflows/schema-check.yml@1927f933ff655934a99660161efc0ca277eea8f0 # v2.6.0
    # Every key a check.json row may carry, so none is dropped (the consumer kit of practice-library/.github).
    with:
      schema: ${{ matrix.schema }}
      instances: ${{ matrix.instances }}
      resolve: ${{ matrix.resolve }}
      guards: ${{ matrix.guards }}
      expect: ${{ matrix.expect }}
      each: ${{ matrix.each }}
      mode: ${{ matrix.mode }}
      resolve-ids: ${{ matrix.resolve-ids }}

  leak-scan:
    uses: practice-library/.github/.github/workflows/leak-scan.yml@1927f933ff655934a99660161efc0ca277eea8f0 # v2.6.0

  denylist:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@1927f933ff655934a99660161efc0ca277eea8f0 # v2.6.0
    with:
      guard: denylist

  removed-paths:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@1927f933ff655934a99660161efc0ca277eea8f0 # v2.6.0
    with:
      guard: removed-paths

  release-note:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@1927f933ff655934a99660161efc0ca277eea8f0 # v2.6.0
    with:
      guard: release-note

  schema-loosening:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@1927f933ff655934a99660161efc0ca277eea8f0 # v2.6.0
    with:
      guard: schema-loosening

  gate:
    if: always()
    needs: ["render","selftest","guards","bump-only","graph-check","discover","schema-check","leak-scan","denylist","removed-paths","release-note","schema-loosening"]
    uses: practice-library/.github/.github/workflows/gate.yml@1927f933ff655934a99660161efc0ca277eea8f0 # v2.6.0
    with:
      needs: ${{ toJSON(needs) }}
