# Generated from templates/.github/workflows/checks.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: checks
# Every check a pull request must pass; the ruleset requires "gate / gate".
# Reusable workflows come from practice-library/.github, pinned to the full commit of release v1.0.0.
# The gate's needs and .github/required-checks.json are both rendered from gate.needs in policy/constants.json.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    name: render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generated files match templates/ and policy/constants.json
        run: bash scripts/render.sh --check

  selftest:
    name: selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The scripts the checks use pass and fail where their cases say
        run: bash scripts/selftest.sh

  bump-only:
    name: bump-only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: A pull request touching only allowlisted paths is a date bump and nothing else
        run: bash scripts/bump-only.sh pr

  graph-check:
    name: graph-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Edges stay inside each vendor graph; every source host is in policy/sources.json
        run: bash scripts/graph-check.sh

  discover:
    uses: practice-library/.github/.github/workflows/discover.yml@18375c2eb2205e1095029b00ee8fddb16a55f622 # v1.0.0
    with:
      check: schema-check

  schema-check:
    name: schema-check (${{ matrix.instances }})
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    uses: practice-library/.github/.github/workflows/schema-check.yml@18375c2eb2205e1095029b00ee8fddb16a55f622 # v1.0.0
    with:
      schema: ${{ matrix.schema }}
      instances: ${{ matrix.instances }}
      expect: ${{ matrix.expect }}
      each: ${{ matrix.each }}

  leak-scan:
    uses: practice-library/.github/.github/workflows/leak-scan.yml@18375c2eb2205e1095029b00ee8fddb16a55f622 # v1.0.0

  gate:
    if: always()
    needs: ["render","selftest","bump-only","graph-check","discover","schema-check","leak-scan"]
    uses: practice-library/.github/.github/workflows/gate.yml@18375c2eb2205e1095029b00ee8fddb16a55f622 # v1.0.0
    with:
      needs: ${{ toJSON(needs) }}
