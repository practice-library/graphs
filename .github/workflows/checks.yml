name: checks
# Uses the organisation's reusable workflows, pinned to a commit of practice-library/.github.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  discover:
    name: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every check.json, with its paths made relative to the repository root
        id: list
        shell: bash
        run: |
          set -euo pipefail
          targets="$(git ls-files -- 'check.json' '*/check.json' | while IFS= read -r f; do
            d="$(dirname "$f")"
            jq -c --arg d "$d" --arg f "$f" '
              if (keys | sort) != ["instances", "schema"] then error($f + ": keys must be exactly schema and instances")
              else {target: $d, schema: ($d + "/" + .schema), instances: ($d + "/" + .instances)} end' "$f"
          done | jq -sc '.')"
          [ "$(jq 'length' <<<"$targets")" -gt 0 ] || { echo "::error::no check.json found"; exit 1; }
          while IFS= read -r p; do
            [ -e "$p" ] || { echo "::error::$p does not exist"; exit 1; }
          done < <(jq -r '.[] | .schema, .instances' <<<"$targets")
          echo "$targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  schema-check:
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    uses: practice-library/.github/.github/workflows/schema-check.yml@0e6f5ed237dd52f9fe02a33f8c6b8ec653a3a2c3
    with:
      schema: ${{ matrix.schema }}
      instances: ${{ matrix.instances }}

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same tool and pin as practice-library/.github's schema-check. Its expect input is not
      # public, so the counter-examples (which must fail) run here.
      - name: Fetch jsonschema 17.2.1, pinned by sha256
        shell: bash
        env:
          TOOL_URL: https://github.com/sourcemeta/jsonschema/releases/download/v17.2.1/jsonschema-17.2.1-linux-x86_64.zip
          TOOL_SHA256: 9ffee3cfbe0fe1343d9d36bcce9e6036ec4d73e4b29f656c039fca6118da2f35
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tools/jsonschema"
          mkdir -p "$dir"
          curl -fsSL --retry 3 "$TOOL_URL" -o "$dir/archive"
          echo "$TOOL_SHA256  $dir/archive" | sha256sum -c -
          unzip -q "$dir/archive" -d "$dir"
      - name: Schemas are valid, examples pass, counter-examples are rejected
        run: bash scripts/contracts.sh "$RUNNER_TEMP/tools/jsonschema/jsonschema-17.2.1-linux-x86_64/bin/jsonschema"

  leak-scan:
    uses: practice-library/.github/.github/workflows/leak-scan.yml@0e6f5ed237dd52f9fe02a33f8c6b8ec653a3a2c3
  gate:
    if: always()
    needs: [discover, schema-check, contracts, leak-scan]
    uses: practice-library/.github/.github/workflows/gate.yml@0e6f5ed237dd52f9fe02a33f8c6b8ec653a3a2c3
    with:
      needs: ${{ toJSON(needs) }}
      required: '["discover","schema-check","contracts","leak-scan"]'
