name: Fact request
description: Ask for a fact the graph does not have yet.
labels: [fact-request]
body:
  - type: dropdown
    id: graph
    attributes:
      label: Graph
      description: The domain and vendor the fact belongs to.
      options:
        - vendors/anthropic
        - vendors/cloudflare
        - vendors/supabase
        - vendors/temporal
        - vendors/orca
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: The fact you need, as one question, e.g. "How many requests per minute does the lowest API tier allow?"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Optional. A link to the vendor's own page that answers it.
  - type: textarea
    id: quote
    attributes:
      label: Quote
      description: Optional. The sentence on that page that answers it, copied exactly.
  - type: checkboxes
    id: public
    attributes:
      label: Public only
      options:
        - label: The question names no private project, account, usage figure or person.
          required: true
